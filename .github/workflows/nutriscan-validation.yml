name: NutriScan validation
on:
  pull_request:
  push:
    branches:
      - mejora/reconocimiento-seguro-v24
jobs:
  nutrition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run nutrition safety tests
        run: |
          node tests/nutrition.test.js
          node tests/catalog.test.js
          node tests/benchmark.test.js
          node tests/barcode.test.js
          node tests/backup.test.js
          node tests/vision-gate.test.js
          node tests/integration.test.js
      - name: Check JavaScript syntax
        run: |
          node --check src/nutrition.js
          node --check src/catalog.js
          node --check src/benchmark.js
          node --check src/barcode.js
          node --check src/backup.js
          node --check src/vision-gate.js
          node --check tests/vision-gate.test.js
          node --check tests/backup.test.js
          node --check tests/barcode.test.js
          node --check tests/benchmark.test.js
          node --check tests/catalog.test.js
          node --check tests/integration.test.js
