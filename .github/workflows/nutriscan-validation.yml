name: NutriScan validation
on:
  pull_request:
  push:
    branches:
      - mejora/reconocimiento-seguro-v24
jobs:
  nutrition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run nutrition safety tests
        run: node tests/nutrition.test.js
      - name: Check JavaScript syntax
        run: node --check src/nutrition.js
